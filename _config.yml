# About Section
# about_title: About Me (Use this to override about section title)
about_profile_image: images/square.png
about_content: | # this will include new lines to allow paragraphs
  Hi, I'm Nikos — a product lead and computational biologist with five years at Novo Nordisk across target discovery, target maturation and clinical-trial omics. I built a scientific data platform from scratch and led its strategy, development and adoption across R&D. I combine hands-on [R/Shiny](https://shiny.rstudio.com/) expertise and a PhD in Cancer Genomics with experience translating scientific needs into practical software for researchers.

  I got my bachelor's degree in Computer Science at the [Aristotle University of Thessaloniki](https://www.auth.gr/en) and later moved into bioinformatics, acquiring a master's degree and a PhD at the [University of Copenhagen](https://www.ku.dk/english/).

  Outside of work I am head coach of adult volleyball teams and have led teams to championships in the Danish 1st and 2nd Divisions. I also author R packages — including [sinaplot](https://cran.r-project.org/web/packages/sinaplot/vignettes/SinaPlot.html) / [geom_sina](https://ggforce.data-imaginist.com/reference/geom_sina.html) — and I enjoy analog photography.

